<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Xero Shop - Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="index.html">Xero Shop</a>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="shop.html">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Products -->
  <section class="py-5">
    <div class="container">
      <h2 class="mb-4 text-center">Our Products</h2>
      <div class="row g-4">
        <!-- Product Card -->
        <div class="col-md-4">
          <div class="card shadow-sm">
            <img src="https://via.placeholder.com/300x200" class="card-img-top">
            <div class="card-body text-center">
              <h5>Product 1</h5>
              <p>$25</p>
              <a href="cart.html" class="btn btn-primary">Add to Cart</a>
            </div>
          </div>
        </div>
        <!-- More product cards… -->
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white text-center py-3">
    <p>© 2025 Xero Shop. All Rights Reserved.</p>
  </footer>
</body>
</html>
